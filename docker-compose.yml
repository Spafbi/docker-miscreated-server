x-mis-common: &mis-common
  image: miscreated-wine:latest
  build:
    context: .
    dockerfile: Dockerfile
    # Non-root user/group IDs baked into the image at build time.
    # To use your current user's IDs: MIS_UID=$(id -u) MIS_GID=$(id -g) docker compose build
    args:
      UID: ${MIS_UID:-1000}
      GID: ${MIS_GID:-1000}
  stdin_open: true
  tty: true
  networks:
    - mis-network
  # network_mode: host
  # read_only: true
  tmpfs:
    - /tmp:size=512M,noexec,nosuid
    - /run:size=10M,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        memory: 6G
        cpus: "2.5"
        pids: 256
      reservations:
        memory: 2G
        cpus: "0.5"
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  healthcheck:
    test: ["CMD", "python3", "/usr/local/bin/misrcon.py"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 300s
  restart: unless-stopped

networks:
  mis-network:
    driver: bridge

services:
  mis1:
    <<: *mis-common
    container_name: miscreated-server
    ports:
      - "64094:64094"
      - "64090-64093:64090-64093/udp"
    environment:
      - BASE_PORT=64090
      - GRANT_ALL_GUIDES=0
      - MAP=islands
      - MAX_PLAYERS=36
      - MIS_GAMESERVERID=100
      - WHITELISTED=0
      - BASE_VEHICLE_LIMITER=-1
      - STEAM_AUTH_TOKEN=${GSLT1}
      - VARIABLE_RESTARTS=1
    volumes:
      - ./data:/server
      # - ./data/wine:/home/steam/.wine