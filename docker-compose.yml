x-mis-common: &mis-common
  image: miscreated-wine:latest
  build: .
  stdin_open: true
  tty: true
  networks:
    - mis-network
  tmpfs:
    - /tmp:size=512M,noexec,nosuid
    - /run:size=10M,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  # Top-level resource limits (compose v2); deploy.resources is only honored in swarm mode
  mem_limit: 6G
  mem_reservation: 2G
  cpus: 2.5
  pids_limit: 1024
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  # RCON needs the RCON port (game port + 4) open and the password from
  # /server/hosting.cfg (see the Files section of README.md).
  healthcheck:
    test: ["CMD", "python3", "/usr/local/bin/misrcon.py", "--server-root", "/server", "-c", "status"]
    interval: 30s
    timeout: 40s
    retries: 3
    # First boot downloads the game via SteamCMD and can take 10+ minutes
    start_period: 600s
  restart: unless-stopped

networks:
  mis-network:
    driver: bridge

services:
  mis1:
    <<: *mis-common
    container_name: miscreated-server
    ports:
      - "64094:64094"
      - "64090-64093:64090-64093/udp"
    environment:
      - BASE_PORT=64090
      - GRANT_ALL_GUIDES=0
      - MAP=islands
      - MAX_PLAYERS=36
      - MIS_GAMESERVERID=100
      - WHITELISTED=0
      - BASE_VEHICLE_LIMITER=-1
      - STEAM_AUTH_TOKEN=${GSLT1}
      - VARIABLE_RESTARTS=1
    volumes:
      - ./data:/server